camera:
  width: 800
  aspect: 1.0
  samples: 2000
  look_from: [0.5, 1.4, 2.8]
  look_at: [0.0, 1.2, 7.2]
  up: [0.0, 1.0, 0.0]
  vfov: 38.0
  focus_dist: 4.6
  aperture: 0.20

environment:
  type: solid
  colour: [0.03, 0.04, 0.055]

materials:
  ground:
    type: lambertian
    albedo: [1.0, 1.0, 1.0]
  peach:
    type: plastic
    albedo: [0.96, 0.58, 0.50]
    roughness: 0.04
  yellow:
    type: plastic
    albedo: [0.95, 0.78, 0.22]
    roughness: 0.04
  pink:
    type: plastic
    albedo: [0.92, 0.38, 0.55]
    roughness: 0.04
  light:
    type: diffuse_light
    emission: [5000.0, 5000.0, 5000.0]

objects:
  - type: plane_patch
    corner: [-50.0, 0.0, -50.0]
    u: [100.0, 0.0, 0.0]
    v: [0.0, 0.0, 100.0]
    material: ground
  - type: plane_patch
    corner: [40.0, 0.0, 16.0]
    u: [-80.0, 0.0, 0.0]
    v: [0.0, 40.0, 0.0]
    material: ground
  - type: sphere
    center: [0.0, 1.25, 7.4]
    radius: 1.25
    material: peach
  - type: sphere
    center: [-1.3, 0.4, 4.6]
    radius: 0.4
    material: yellow
  - type: sphere
    center: [2.2, 0.75, 8.4]
    radius: 0.75
    material: pink
  - type: sphere
    center: [1.5, 0.35, 9.6]
    radius: 0.35
    material: pink
  - type: sphere
    center: [-4.5, 8.0, 3.5]
    radius: 0.3
    material: light
    area_light: true
