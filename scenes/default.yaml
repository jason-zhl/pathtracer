camera:
  width: 800
  aspect: 1.0
  samples: 2000
  look_from: [0.0, 2.0, 0.0]
  look_at: [0.0, 2.0, 1.0]
  up: [0.0, 1.0, 0.0]
  vfov: 40.0
  focus_dist: 10.0
  aperture: 0.20
  exposure: 0.6

environment:
  type: solid
  colour: [0.53, 0.81, 0.92]

materials:
  ground:
    type: lambertian
    albedo: [0.5, 0.5, 0.5]
  red:
    type: plastic
    albedo: [0.85, 0.15, 0.12]
    roughness: 0.04
  green:
    type: plastic
    albedo: [0.314, 0.784, 0.12]
    roughness: 0.04
  light:
    type: diffuse_light
    emission: [2000.0, 2000.0, 2000.0]

objects:
  - type: plane_patch
    corner: [-50.0, 0.0, -50.0]
    u: [100.0, 0.0, 0.0]
    v: [0.0, 0.0, 100.0]
    material: ground
  - type: sphere
    center: [0.0, 2.0, 10.0]
    radius: 2.0
    material: red
  - type: sphere
    center: [-1.8, 0.5, 8.5]
    radius: 0.5
    material: green
  - type: sphere
    center: [-50.0, 70.0, 6.0]
    radius: 3.0
    material: light
    area_light: true
