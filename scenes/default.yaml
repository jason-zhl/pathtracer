camera:
  width: 800
  aspect: 1.0
  samples: 2000
  look_from: [0.0, 3.0, 0.0]
  look_at: [0.0, 3.0, 15.0]
  up: [0.0, 1.0, 0.0]
  vfov: 40.0
  focus_dist: 15.0
  aperture: 0.25

environment:
  type: solid
  colour: [1.0, 1.0, 1.0]

materials:
  ground:
    type: lambertian
    albedo: [1.0, 1.0, 1.0]
  red:
    type: plastic
    albedo: [0.85, 0.15, 0.12]
    roughness: 0.12
  green:
    type: plastic
    albedo: [0.314, 0.784, 0.12]
    roughness: 0.12
  light:
    type: diffuse_light
    emission: [50.0, 50.0, 50.0]

objects:
  - type: plane_patch
    corner: [-50.0, 0.0, -50.0]
    u: [100.0, 0.0, 0.0]
    v: [0.0, 0.0, 100.0]
    material: ground
  - type: sphere
    center: [0.0, 3.0, 15.0]
    radius: 3.0
    material: red
  - type: sphere
    center: [-2.0, 0.5, 8.0]
    radius: 0.5
    material: green
  - type: sphere
    center: [-20.0, 40.0, 0.0]
    radius: 6.0
    material: light
    area_light: true
